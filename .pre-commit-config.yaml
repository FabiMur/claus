repos:
  - repo: local
    hooks:
      - id: fmt
        name: rustfmt
        entry: cargo fmt --all
        language: system
        types: [rust]
        pass_filenames: false

      - id: clippy
        name: clippy
        entry: cargo clippy --all-targets --all-features --
        args: [-D, warnings]
        language: system
        types: [rust]
        pass_filenames: false

      - id: test
        name: cargo test
        entry: cargo test
        language: system
        types: [rust]
        pass_filenames: false

      - id: taplo
        name: taplo fmt
        entry: taplo fmt
        language: system
        files: \.toml$
        pass_filenames: true

      - id: committed
        name: conventional commits
        entry: committed --commit-file
        language: system
        stages: [commit-msg]
        pass_filenames: true
