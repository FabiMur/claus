[package]
edition = "2024"
name = "claus"
version = "0.1.0"

[dependencies]
anyhow = "1.0.104"
async-trait = "0.1.92"
blake3 = "1.8.7"
crossterm = "0.29"
dotenvy = "0.15.7"
futures-util = "0.3.34"
qdrant-client = "1.19.0"
ratatui = "0.30.2"
reqwest = { version = "0.13.4", features = ["json", "stream"] }
serde = { version = "1.0.229", features = ["derive"] }
